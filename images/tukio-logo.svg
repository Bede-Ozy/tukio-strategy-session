<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none" width="100%" height="100%">
  <!-- Definitions for gradients & shadows -->
  <defs>
    <linearGradient id="tukioOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8533"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#E05300"/>
    </linearGradient>
    <linearGradient id="tukioBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F2A4A"/>
    </linearGradient>
    <linearGradient id="tukioGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF6B00" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Modern Dynamic Monogram Icon (Events / Momentum / Assembly) -->
  <g transform="translate(10, 10)">
    <!-- Outer Dynamic Halo Ring segment -->
    <path d="M 40 4 A 36 36 0 0 1 76 40 A 36 36 0 0 1 65 65" 
          stroke="url(#tukioOrangeGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 40 76 A 36 36 0 0 1 4 40 A 36 36 0 0 1 18 16" 
          stroke="url(#tukioBlueGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
          
    <!-- Stylized Modern 'T' with Event Sparks -->
    <rect x="20" y="24" width="40" height="8" rx="4" fill="url(#tukioOrangeGrad)" filter="url(#glow)"/>
    <rect x="36" y="24" width="8" height="38" rx="4" fill="url(#tukioOrangeGrad)"/>
    
    <!-- Accent Spark/Dot for Strategic Precision -->
    <circle cx="65" cy="20" r="5" fill="url(#tukioGoldGrad)"/>
    <circle cx="15" cy="58" r="4" fill="#38BDF8"/>
    <circle cx="40" cy="70" r="3" fill="#FF8533"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(105, 20)">
    <!-- TUKIO Heading -->
    <text x="0" y="36" font-family="'Outfit', 'Montserrat', 'Inter', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="2.5">
      TUKIO
    </text>
    <text x="132" y="36" font-family="'Outfit', 'Montserrat', 'Inter', sans-serif" font-size="34" font-weight="900" fill="#FF6B00" letter-spacing="2.5">
      .
    </text>
    
    <!-- KONSULTS LIMITED Sub-title -->
    <text x="1" y="56" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#9CA3AF" letter-spacing="5">
      KONSULTS LIMITED
    </text>
  </g>
</svg>
